apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: cg-bcsstk34
spec:
  slotsPerWorker: 1
  mpiImplementation: MPICH
  sshAuthMountPath: /home/mpiuser/.ssh
  launcherCreationPolicy: WaitForWorkersReady
  runPolicy:
    cleanPodPolicy: Running
    activeDeadlineSeconds: 3600
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          containers:
            - name: cg-launcher
              image: srmarinho/cg-mpi:arm64
              imagePullPolicy: Always
              securityContext:
                runAsUser: 1000
              args:
                - mpirun
                - -n
                - "2"
                - /opt/cg/bin/cg_mpi
                - --matrix
                - /opt/cg/matrices/bcsstk34/bcsstk34.mtx
                - --block-size
                - "8"
                - --tol
                - "1e-8"
                - --max-iters
                - "10000"
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
    Worker:
      replicas: 2
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          containers:
            - name: cg-worker
              image: srmarinho/cg-mpi:arm64
              imagePullPolicy: Always
              securityContext:
                runAsUser: 1000
              command: [/usr/sbin/sshd]
              args: [-De, -f, /home/mpiuser/.sshd_config]
              readinessProbe:
                tcpSocket:
                  port: 2222
                initialDelaySeconds: 2
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
