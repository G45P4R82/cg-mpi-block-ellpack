apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: cg-bcsstk16-b8-p4-t1-r3-4nodes-dist-d12
  labels:
    experiment: node-scaling-dist
    node-count: "4"
    variant: distributed
spec:
  slotsPerWorker: 1
  mpiImplementation: MPICH
  sshAuthMountPath: /home/mpiuser/.ssh
  launcherCreationPolicy: WaitForWorkersReady
  runPolicy:
    cleanPodPolicy: Running
    activeDeadlineSeconds: 3600
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["tvbox01"]
          containers:
            - name: cg-launcher
              image: srmarinho/cg-mpi:arm64-dist
              imagePullPolicy: Always
              securityContext:
                runAsUser: 1000
              env:
                - name: OMP_NUM_THREADS
                  value: "1"
                - name: OMP_PROC_BIND
                  value: close
                - name: OMP_PLACES
                  value: cores
              args:
                - mpirun
                - -n
                - "4"
                - /opt/cg/bin/cg_mpi_distributed
                - --matrix
                - /opt/cg/matrices/bcsstk16/bcsstk16.mtx
                - --block-size
                - "8"
                - --threads
                - "1"
                - --tol
                - "1e-8"
                - --max-iters
                - "10000"
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
                requests:
                  cpu: "200m"
                  memory: 256Mi
    Worker:
      replicas: 4
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["tvbox02","tvbox03","cluster-tvbox-04","cluster-tvbox-05"]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution: [{labelSelector: {matchExpressions: [{key: training.kubeflow.org/job-name, operator: In, values: [cg-bcsstk16-b8-p4-t1-r3-4nodes-dist-d12]}, {key: training.kubeflow.org/job-role, operator: In, values: [worker]}]}, topologyKey: kubernetes.io/hostname}]
          containers:
            - name: cg-worker
              image: srmarinho/cg-mpi:arm64-dist
              imagePullPolicy: Always
              securityContext:
                runAsUser: 1000
              env:
                - name: OMP_NUM_THREADS
                  value: "1"
                - name: OMP_PROC_BIND
                  value: close
                - name: OMP_PLACES
                  value: cores
              command: [/usr/sbin/sshd]
              args: [-De, -f, /home/mpiuser/.sshd_config]
              readinessProbe:
                tcpSocket:
                  port: 2222
                initialDelaySeconds: 2
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
                requests:
                  cpu: "200m"
                  memory: 256Mi
